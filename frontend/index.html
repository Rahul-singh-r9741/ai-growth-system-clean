<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Growth System — Rahul Singh</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Basic SEO -->
  <meta name="description" content="AI-powered lead generation and growth automation system for startups using FastAPI and local LLMs." />
  <meta name="keywords" content="AI lead generation, startup growth automation, CRM chatbot, FastAPI AI" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #020617;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 5px;
      border: none;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    .response {
      margin-top: 15px;
      font-size: 14px;
      background: #020617;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>AI Growth Assistant</h2>

    <input id="name" placeholder="Your Name" />
    <input id="email" placeholder="Your Email" />
    <input id="business" placeholder="Business Type (e.g. SaaS, Agency)" />
    <textarea id="challenge" placeholder="Your Growth Challenge"></textarea>

    <button onclick="sendLead()">Get AI Growth Plan</button>

    <div id="response" class="response"></div>
  </div>

  <script>
    async function sendLead() {
      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        business: document.getElementById("business").value,
        challenge: document.getElementById("challenge").value
      };

      document.getElementById("response").innerText = "Thinking...";

      try {
        const res = await fetch("http://127.0.0.1:8000/lead", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        document.getElementById("response").innerText = result.message;
      } catch (err) {
        document.getElementById("response").innerText =
          "Could not connect to AI server. Make sure FastAPI is running.";
      }
    }
  </script>
</body>
</html>
