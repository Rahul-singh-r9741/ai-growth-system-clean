<!DOCTYPE html>
<html>
<head>
  <title>AI Lead Capture Agent</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-y: auto;
    }
    .card {
      background: #020617;
      padding: 20px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
    }
    input, textarea, button {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      border-radius: 5px;
      border: none;
    }
    button {
      background: #38bdf8;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>AI Lead Agent</h2>
    <input id="name" placeholder="Name" />
    <input id="email" placeholder="Email" />
    <input id="business" placeholder="Business" />
    <textarea id="challenge" placeholder="Challenge"></textarea>
    <button onclick="sendLead()">Submit</button>
    <p id="status"></p>
    <pre id="aiResponse" style="
    margin-top:10px;
    background:#020617;
    padding:10px;
    border-radius:5px;
    white-space:pre-wrap;
    "></pre>

  </div>

  <script>
    async function sendLead() {
      const lead = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        business: document.getElementById("business").value,
        challenge: document.getElementById("challenge").value
      };

      const status = document.getElementById("status");

      try {
        const response = await fetch("https://ai-growth-system-production.up.railway.app/lead", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(lead)
        });

        const data = await response.json();

        status.innerText = "Lead saved successfully";

        const aiBox = document.getElementById("aiResponse");
        aiBox.innerText = data.ai_message || "No AI response received.";


      } catch (err) {
        console.error(err);
        status.innerText = "Offline mode: Lead saved locally";
        saveOffline(lead);
      }
    }

    function saveOffline(lead) {
      let leads = JSON.parse(localStorage.getItem("offlineLeads") || "[]");
      leads.push(lead);
      localStorage.setItem("offlineLeads", JSON.stringify(leads));
    }
  </script>
</body>
</html>
